services:
  backend:
    build:
      context: ./backend
    container_name: synchro-backend
    # Host networking so the backend can reach the PostgreSQL server through
    # the FortiClient VPN (bridge NAT traffic is blocked by the VPN client)
    network_mode: host
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      FRONTEND_URL: http://${HOST_IP}:5173
      GOOGLE_CALLBACK_URL: http://${HOST_IP}:3030/auth/google/callback

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://${HOST_IP}:3030
    container_name: synchro-frontend
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
